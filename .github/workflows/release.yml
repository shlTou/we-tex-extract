name: build-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法自检
        run: python -m py_compile we_extract.py

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: 打包单文件 exe
        run: >
          pyinstaller --onefile --console --clean --noconfirm
          --icon assets/app.ico
          --name we-extract
          we_extract.py

      - name: 冒烟测试（无参数应打印用法并返回 1）
        shell: pwsh
        run: |
          dist\we-extract.exe
          if ($LASTEXITCODE -ne 1) { throw "exit code 应为 1，实际 $LASTEXITCODE" }

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/we-extract.exe
          generate_release_notes: true

      - name: 保存产物（手动触发时可下载）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: we-extract-exe
          path: dist/we-extract.exe
